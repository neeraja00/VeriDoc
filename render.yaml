services:
  - type: web
    name: veridoc-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/system/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: EMBEDDING_PROVIDER
        value: gemini
      - key: EMBEDDING_MODEL
        value: text-embedding-004
      - key: CHROMA_PERSIST_DIR
        value: ./data/chroma_db
      - key: COLLECTION_NAME
        value: knowledge_assistant
      - key: DEFAULT_CHUNK_SIZE
        value: "800"
      - key: DEFAULT_CHUNK_OVERLAP
        value: "150"
      - key: DEFAULT_TOP_K
        value: "4"
      - key: SIMILARITY_SCORE_THRESHOLD
        value: "0.25"
